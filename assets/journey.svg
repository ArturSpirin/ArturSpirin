<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Before AI: Test Automation Architect. After AI: AI Systems Engineer. Same discipline: make systems prove they work.">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1c2633" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowR" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8b7cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .eyebrow{font-size:12px;letter-spacing:.14em}
      .role{font-size:24px;font-weight:600}
      .it{font-size:13.5px;fill:#8b949e}
      .flow{stroke-dasharray:6 10;animation:dash 1.2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-32}}
      .ai{opacity:.35;animation:on 6s infinite}
      .a2{animation-delay:.5s}.a3{animation-delay:1s}.a4{animation-delay:1.5s}
      @keyframes on{0%,10%{opacity:.35}18%,80%{opacity:1}92%,100%{opacity:.35}}
      .chk{animation:chk 6s infinite}
      .c2{animation-delay:.5s}.c3{animation-delay:1s}.c4{animation-delay:1.5s}
      @keyframes chk{0%,10%{fill:#30363d}16%,100%{fill:#3fb950}}
    </style>
  </defs>

  <rect width="1000" height="260" rx="18" fill="#0a0e14"/>
  <rect width="1000" height="260" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="260" rx="18" fill="url(#glowR)"/>
  <rect x="0.5" y="0.5" width="999" height="259" rx="18" fill="none" stroke="#21262d"/>

  <!-- BEFORE -->
  <rect x="30" y="30" width="400" height="200" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
  <text x="54" y="62" class="mono eyebrow" fill="#3fb950">BEFORE AI</text>
  <text x="54" y="96" class="sans role" fill="#c9d1d9">Test Automation Architect</text>
  <g class="mono" font-size="13.5">
    <circle cx="60" cy="126" r="4" class="chk c1"/><text x="74" y="131" class="it">Automation frameworks from scratch</text>
    <circle cx="60" cy="152" r="4" class="chk c2"/><text x="74" y="157" class="it">Selenium, Appium, CI at scale</text>
    <circle cx="60" cy="178" r="4" class="chk c3"/><text x="74" y="183" class="it">Test Junkie, open source since 2018</text>
    <circle cx="60" cy="204" r="4" class="chk c4"/><text x="74" y="209" class="it">Teaching it on YouTube</text>
  </g>

  <!-- transition -->
  <path d="M440 130 H560" stroke="#30363d" stroke-width="2" fill="none"/>
  <path d="M440 130 H560" stroke="url(#beam)" stroke-width="2" fill="none" class="flow"/>
  <path d="M552 122 L562 130 L552 138" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <circle r="5" fill="#e6edf3"><animateMotion dur="1.8s" repeatCount="indefinite" path="M440 130 H556"/>
    <animate attributeName="fill" values="#3fb950;#a78bfa" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="500" y="110" text-anchor="middle" class="mono" font-size="11" fill="#545d68">same discipline</text>
  <text x="500" y="158" text-anchor="middle" class="mono" font-size="11" fill="#545d68">new operator</text>

  <!-- AFTER -->
  <rect x="570" y="30" width="400" height="200" rx="12" fill="#120f22" stroke="#8b7cf6" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="594" y="62" class="mono eyebrow" fill="#a78bfa">AFTER AI</text>
  <text x="594" y="96" class="sans role" fill="#e6edf3">AI Systems Engineer</text>
  <g class="mono" font-size="13.5" fill="#c9d1d9">
    <text x="594" y="131" class="ai a1">› harnesses that verify agent work</text>
    <text x="594" y="157" class="ai a2">› multi-agent orchestration</text>
    <text x="594" y="183" class="ai a3">› context, memory, code indexing</text>
    <text x="594" y="209" class="ai a4">› agents on Kubernetes, GitOps</text>
  </g>
</svg>
