<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Artur Spirin — agent harnesses, orchestration, context engineering">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1c2633" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="77%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#8b7cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .w{opacity:0;animation:cycle 9s infinite}
      .w2{animation-delay:3s}.w3{animation-delay:6s}
      @keyframes cycle{0%{opacity:0;transform:translateY(8px)}5%{opacity:1;transform:translateY(0)}30%{opacity:1;transform:translateY(0)}35%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
      .flow{stroke-dasharray:4 9;animation:dash 1.6s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-26}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .node{fill:#11161f;stroke:#30363d;stroke-width:1.5}
      .test{animation:ok 2.4s infinite}
      @keyframes ok{0%,60%{stroke:#30363d}75%{stroke:#3fb950}100%{stroke:#30363d}}
      .lbl{fill:#c9d1d9;font-size:10.5px;text-anchor:middle;dominant-baseline:central}
    </style>
  </defs>

  <rect width="1000" height="300" rx="18" fill="#0a0e14"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="300" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#21262d"/>

  <!-- left: identity -->
  <text x="56" y="78" class="mono" font-size="14" fill="#7d8590">~/artur-spirin <tspan fill="#3fb950">main</tspan><tspan class="blink" fill="#c9d1d9"> ▍</tspan></text>
  <text x="54" y="142" class="sans" font-size="58" font-weight="700" fill="#e6edf3">Artur Spirin</text>
  <text x="56" y="186" class="sans" font-size="19" fill="#8b949e">AI systems engineer. I build the environments agents work in:</text>

  <g class="sans" font-size="28" font-weight="600">
    <text x="56" y="232" class="w w1" fill="#22d3ee">› agent harnesses</text>
    <text x="56" y="232" class="w w2" fill="#a78bfa">› multi-agent orchestration</text>
    <text x="56" y="232" class="w w3" fill="#3fb950">› context &amp; memory</text>
  </g>

  <text x="56" y="268" class="mono" font-size="13" fill="#545d68">// 10 years of test automation → now building for agents</text>

  <!-- right: orchestration graph -->
  <g stroke="#262c36" stroke-width="1" fill="none" stroke-dasharray="2 6">
    <path d="M770 45 L875 110 L850 240 L690 240 L665 110 Z"/>
  </g>
  <g stroke="#30363d" stroke-width="1.5">
    <line x1="770" y1="150" x2="770" y2="45"/>
    <line x1="770" y1="150" x2="875" y2="110"/>
    <line x1="770" y1="150" x2="850" y2="240"/>
    <line x1="770" y1="150" x2="690" y2="240"/>
    <line x1="770" y1="150" x2="665" y2="110"/>
  </g>
  <g stroke="#8b7cf6" stroke-width="1.5" class="flow" opacity="0.8">
    <line x1="770" y1="150" x2="770" y2="45"/>
    <line x1="770" y1="150" x2="875" y2="110"/>
    <line x1="770" y1="150" x2="850" y2="240"/>
    <line x1="770" y1="150" x2="665" y2="110"/>
  </g>
  <line x1="690" y1="240" x2="770" y2="150" stroke="#3fb950" stroke-width="1.5" class="flow" opacity="0.8"/>

  <!-- packets -->
  <g fill="#22d3ee">
    <circle r="3.5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M770 150 L770 45"/></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="0.5s" repeatCount="indefinite" path="M770 150 L875 110"/></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite" path="M770 150 L850 240"/></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M770 150 L665 110"/></circle>
  </g>
  <circle r="3.5" fill="#3fb950"><animateMotion dur="2.4s" begin="0.3s" repeatCount="indefinite" path="M690 240 L770 150"/></circle>

  <!-- center pulse -->
  <circle cx="770" cy="150" r="32" fill="none" stroke="#8b7cf6" stroke-width="1.5">
    <animate attributeName="r" values="32;60" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="770" cy="150" r="32" fill="#151026" stroke="#8b7cf6" stroke-width="2"/>
  <text x="770" y="150" class="mono lbl" fill="#e6edf3" style="fill:#e6edf3;font-size:11px">orchestrator</text>

  <g class="mono">
    <circle cx="770" cy="45" r="25" class="node"/><text x="770" y="45" class="lbl">plan</text>
    <circle cx="875" cy="110" r="25" class="node"/><text x="875" y="110" class="lbl">index</text>
    <circle cx="850" cy="240" r="25" class="node"/><text x="850" y="240" class="lbl">code</text>
    <circle cx="690" cy="240" r="25" class="node test"/><text x="690" y="240" class="lbl">test</text>
    <circle cx="665" cy="110" r="25" class="node"/><text x="665" y="110" class="lbl">memory</text>
  </g>
</svg>
